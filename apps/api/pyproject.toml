[project]
name = "lys-api"
version = "0.1.0"
description = "API FastAPI cho hệ thống khảo sát & phân tích phản hồi"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.142,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "structlog>=26.1",
  "sqlalchemy[asyncio]>=2.0.40,<2.2",
  "asyncpg>=0.31,<1.0",
  "alembic>=1.20,<2",
  "redis>=8.1,<9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
