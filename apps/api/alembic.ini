# Dùng cho lệnh `alembic` khi phát triển, ví dụ:
#   cd apps/api && uv run alembic revision --autogenerate -m "mo_ta"
# Chạy migration: `uv run python -m app.cli migrate` (hoặc `make migrate`).
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
