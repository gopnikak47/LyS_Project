[project]
name = "lys-worker"
version = "0.1.0"
description = "Celery worker & beat: NLP theo lô, import, gửi email, báo cáo, sao lưu"
requires-python = ">=3.11,<3.12"
dependencies = [
  "lys-api",
  "lys-nlp",
  "celery[redis]>=5.6,<6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
