# Cài: `uvx pre-commit install` (hoặc `pip install pre-commit && pre-commit install`)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, yaml, markdown]
      - id: i18n-keys
        name: i18n vi/en khớp khóa
        entry: node packages/shared/scripts/check-i18n.mjs
        language: system
        files: ^packages/shared/i18n/
        pass_filenames: false
