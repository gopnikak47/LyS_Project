name: CI

on:
  push:
    branches: [main, claude/bat-dau-code-rb4lid]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lys_test
          POSTGRES_USER: lys
          POSTGRES_PASSWORD: lys
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lys -d lys_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://lys:lys@localhost:5432/lys_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Cài phụ thuộc
        run: uv sync --frozen --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy apps/api/app apps/worker/worker packages/nlp/src apps/api/tests apps/worker/tests packages/nlp/tests
      - name: Pytest
        run: uv run pytest --cov=app --cov=worker --cov=lys_nlp --cov-report=term-missing
      - name: Backup and restore on disposable database
        env:
          PGHOST: localhost
          PGUSER: lys
          PGPASSWORD: lys
          PGDATABASE: lys_test
        run: |
          sudo mkdir -p /backups
          sudo chown "$USER" /backups
          sh infra/backup/backup.sh
          createdb lys_test_restore
          dump=$(find /backups -name '*.dump' | head -n 1)
          PGDATABASE=lys_test_restore RESTORE_CONFIRM=lys_test_restore sh infra/backup/restore.sh "$dump"
          original=$(psql -Atc 'SELECT count(*) FROM tenants')
          restored=$(PGDATABASE=lys_test_restore psql -Atc 'SELECT count(*) FROM tenants')
          test "$original" = "$restored"
          PGDATABASE=lys_test_restore psql -Atc "SELECT count(*) FROM pg_policies WHERE policyname='tenant_isolation'" | grep -qE '^[1-9][0-9]*$'

  frontend:
    name: Frontend (eslint · tsc · vitest · build · e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lys_test_web
          POSTGRES_USER: lys
          POSTGRES_PASSWORD: lys
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lys -d lys_test_web"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://lys:lys@localhost:5432/lys_test_web
      APP_ENV: test
      SECRET_KEY: ci-test-secret-0123456789-abcdefghijklmnop
      REGISTER_RATE_PER_HOUR: 1000
      LOGIN_RATE_PER_MINUTE: 1000
      API_INTERNAL_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile
      - name: Kiểm tra định dạng (Prettier)
        run: pnpm format:check
      - name: Kiểm tra bản dịch vi/en
        run: pnpm --filter @lys/shared test
      - name: ESLint
        run: pnpm --filter @lys/web lint
      - name: TypeScript
        run: pnpm --filter @lys/web typecheck
      - name: Vitest
        run: pnpm --filter @lys/web test
      - name: Build
        run: pnpm --filter @lys/web build
      - name: Cài Chromium cho Playwright
        run: pnpm --filter @lys/web exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Start real API for E2E
        run: |
          uv sync --frozen --all-packages
          uv run python -m app.cli migrate
          nohup uv run uvicorn app.main:create_app --factory --port 8000 > /tmp/lys-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health
      - name: Playwright E2E (375 / 768 / 1280)
        run: pnpm --filter @lys/web exec playwright test --project=mobile-375 --project=tablet-768 --project=desktop-1280
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: pip-audit (Python)
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace --no-hashes -o /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - name: pnpm audit (Node)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: infra/docker/python.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
