worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Giới hạn upload (import CSV/Excel, ảnh nền khảo sát).
  client_max_body_size 25m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Request-id: giữ của client nếu có, nếu không thì sinh mới — truyền xuống API để log xuyên suốt.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr",'
    '"ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Rate limit thô ở biên; rate limit nghiệp vụ (đăng nhập, gửi khảo sát) nằm trong API.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_status 429;

  # Phân giải lại tên service qua DNS nội bộ của Docker: container tạo lại (đổi IP) hoặc
  # scale nhiều bản sao (`docker compose up --scale api=3`) vẫn được định tuyến đúng.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
    keepalive 16;
  }

  upstream web_upstream {
    zone web_upstream 64k;
    server web:3000 resolve;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host giữ nguyên cổng (vd. localhost:8080) — Next.js so khớp với Origin để chống CSRF cho Server Actions.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Server-Sent Events (dashboard realtime): tắt buffer, giữ kết nối lâu.
    location ~ ^/api/v1/.+/stream$ {
      proxy_pass http://api_upstream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://api_upstream;
      proxy_read_timeout 60s;
    }

    location /_next/static/ {
      proxy_pass http://web_upstream;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://web_upstream;
      # API tự trả X-Request-ID; với trang web thì nginx gắn để tra log.
      add_header X-Request-ID $req_id always;
    }
  }
}
